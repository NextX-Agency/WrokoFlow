<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Background circle with earth gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C97C5C"/>
      <stop offset="100%" stop-color="#B07C4F"/>
    </linearGradient>
    <linearGradient id="leaf" x1="16" y1="12" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B5C5A3"/>
      <stop offset="100%" stop-color="#7B9F6F"/>
    </linearGradient>
  </defs>
  
  <!-- Main circle -->
  <rect width="48" height="48" rx="14" fill="url(#bg)"/>
  
  <!-- Stylized W letterform made of flowing lines -->
  <path d="M12 16L18 32L24 20L30 32L36 16" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Small leaf accent (Surinamese nature touch) -->
  <path d="M34 12C34 12 38 14 38 18C38 22 34 24 34 24C34 24 36 20 34 16C33 14 34 12 34 12Z" fill="url(#leaf)" opacity="0.9"/>
  <path d="M34 12C34 12 30 14 30 18C30 22 34 24 34 24C34 24 32 20 34 16C35 14 34 12 34 12Z" fill="url(#leaf)" opacity="0.7"/>
</svg>
